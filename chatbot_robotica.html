<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot del Club de Robótica Escolar</title>
    <link rel="stylesheet" href="chatbot_robotica.css">
</head>
<body>

    <div class="contenedor-chat">

        <!-- Encabezado -->
        <header class="chat-cabecera">
            <div class="avatar">🤖</div>
            <div class="titulos">
                <h1>BibliaBot</h1>
                <p class="subtitulo"><span class="punto"></span> Chatbot educativo en línea</p>
            </div>
            <div class="acciones-cabecera">
                <button id="botonEnsenar" title="Enseñar al chatbot" aria-label="Enseñar al chatbot">➕</button>
                <button id="botonLimpiar" title="Borrar conversación" aria-label="Borrar conversación">🗑️</button>
            </div>
        </header>

        <!-- Sugerencias -->
        <div class="sugerencias" id="sugerencias" aria-label="Preguntas sugeridas">
            <button class="chip" data-pregunta="¿Qué es el club de robótica?">¿Qué es el club?</button>
            <button class="chip" data-pregunta="¿Cómo me inscribo?">¿Cómo me inscribo?</button>
            <button class="chip" data-pregunta="¿Cuál es el horario?">¿Cuál es el horario?</button>
            <button class="chip" data-pregunta="¿Qué proyectos hacen?">¿Qué proyectos hacen?</button>
        </div>

        <!-- Historial de mensajes -->
        <main class="mensajes" id="mensajes" aria-live="polite"></main>

        <!-- Entrada de texto -->
        <footer class="entrada">
            <input type="text" id="campoMensaje" placeholder="Escribe tu pregunta..." aria-label="Escribe tu pregunta" maxlength="300">
            <button id="botonEnviar" aria-label="Enviar mensaje">➤</button>
        </footer>

    </div>

    <!-- Modal: enseñar al chatbot -->
    <div id="modalEnsenar" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
        <div class="modal-contenido">
            <h2 id="tituloModal">Enseña al chatbot</h2>
            <p class="modal-descripcion">Agrega una pregunta y su respuesta para que el chatbot la recuerde siempre.</p>
            <form id="formularioEnsenar" novalidate>
                <label>
                    Pregunta
                    <input type="text" id="campoPregunta" maxlength="200" placeholder="Ej. ¿Cuántos integrantes tiene el club?" required>
                </label>
                <label>
                    Respuesta
                    <textarea id="campoRespuesta" rows="4" maxlength="600" placeholder="Ej. El club tiene 25 integrantes distribuidos en 5 equipos." required></textarea>
                </label>
                <div class="acciones-modal">
                    <button type="button" id="botonCancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario">Guardar respuesta</button>
                </div>
            </form>
        </div>
    </div>

    <script src="chatbot_robotica.js"></script>
</body>
</html>
