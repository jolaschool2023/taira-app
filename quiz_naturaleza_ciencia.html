<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master - Naturaleza y Ciencia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #134e5e, #71b280);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 25px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .start-screen {
            text-align: center;
        }

        .game-logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .start-screen h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 10px;
        }

        .start-screen p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .level-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .level-btn {
            padding: 15px 25px;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .level-btn:hover {
            transform: translateY(-3px);
        }

        .level-btn.easy {
            border-color: #27ae60;
            color: #27ae60;
        }

        .level-btn.easy:hover, .level-btn.easy.selected {
            background: #27ae60;
            color: white;
        }

        .level-btn.medium {
            border-color: #f39c12;
            color: #f39c12;
        }

        .level-btn.medium:hover, .level-btn.medium.selected {
            background: #f39c12;
            color: white;
        }

        .level-btn.hard {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .level-btn.hard:hover, .level-btn.hard.selected {
            background: #e74c3c;
            color: white;
        }

        .start-btn {
            padding: 18px 50px;
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(19, 78, 94, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(19, 78, 94, 0.5);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .game-info {
            display: flex;
            gap: 25px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .info-value.score {
            color: #27ae60;
        }

        .info-value.timer {
            color: #e74c3c;
        }

        .progress-container {
            background: #eee;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #134e5e, #71b280);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .question-category {
            display: inline-block;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 22px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            padding: 18px 25px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-btn:hover {
            background: #e8f5e9;
            border-color: #4caf50;
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: #d4edda;
            border-color: #27ae60;
            color: #155724;
        }

        .option-btn.incorrect {
            background: #f8d7da;
            border-color: #e74c3c;
            color: #721c24;
        }

        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.7;
        }

        .option-letter {
            width: 35px;
            height: 35px;
            background: #e0e0e0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .option-btn.correct .option-letter {
            background: #27ae60;
            color: white;
        }

        .option-btn.incorrect .option-letter {
            background: #e74c3c;
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .next-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            display: none;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(19, 78, 94, 0.4);
        }

        .results-screen {
            text-align: center;
        }

        .results-icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .results-screen h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .results-screen .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .final-score {
            font-size: 60px;
            font-weight: 700;
            background: linear-gradient(135deg, #134e5e, #71b280);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

        .stat-card h4 {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .stat-card.correct-stat p {
            color: #27ae60;
        }

        .stat-card.incorrect-stat p {
            color: #e74c3c;
        }

        .level-badge {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .level-badge.easy {
            background: #d4edda;
            color: #155724;
        }

        .level-badge.medium {
            background: #fff3cd;
            color: #856404;
        }

        .level-badge.hard {
            background: #f8d7da;
            color: #721c24;
        }

        .results-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .play-again-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-again-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(19, 78, 94, 0.4);
        }

        .home-btn {
            padding: 15px 40px;
            background: #f8f9fa;
            color: #333;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .home-btn:hover {
            background: #e0e0e0;
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .pulse {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- Pantalla de Inicio -->
        <div class="screen start-screen active" id="start-screen">
            <div class="game-logo">🌿</div>
            <h1>Quiz Master</h1>
            <p>Naturaleza y Ciencia</p>
            
            <div class="level-selector">
                <button class="level-btn easy selected" onclick="selectLevel('easy')">Fácil</button>
                <button class="level-btn medium" onclick="selectLevel('medium')">Medio</button>
                <button class="level-btn hard" onclick="selectLevel('hard')">Difícil</button>
            </div>

            <button class="start-btn" onclick="startGame()">Comenzar Juego</button>
        </div>

        <!-- Pantalla del Juego -->
        <div class="screen" id="game-screen">
            <div class="game-header">
                <div class="game-info">
                    <div class="info-item">
                        <div class="info-label">Pregunta</div>
                        <div class="info-value" id="question-number">1/10</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Puntos</div>
                        <div class="info-value score" id="score">0</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-label">Tiempo</div>
                    <div class="info-value timer" id="timer">30</div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="question-category" id="category">Ciencia</div>
            <h2 class="question-text" id="question">Pregunta aquí...</h2>

            <div class="options-grid" id="options-container">
            </div>

            <div class="feedback" id="feedback"></div>

            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Siguiente Pregunta →</button>
        </div>

        <!-- Pantalla de Resultados -->
        <div class="screen results-screen" id="results-screen">
            <div class="results-icon" id="results-icon">🏆</div>
            <h2 id="results-title">¡Increíble!</h2>
            <p class="subtitle">Has completado el juego</p>
            
            <div class="final-score" id="final-score">0</div>
            <p style="color: #666;">puntos obtenidos</p>

            <div class="level-badge" id="level-badge">Nivel: Fácil</div>

            <div class="stats-grid">
                <div class="stat-card correct-stat">
                    <h4>Correctas</h4>
                    <p id="correct-count">0</p>
                </div>
                <div class="stat-card">
                    <h4>Preguntas</h4>
                    <p id="total-count">10</p>
                </div>
                <div class="stat-card incorrect-stat">
                    <h4>Incorrectas</h4>
                    <p id="incorrect-count">0</p>
                </div>
            </div>

            <div class="results-buttons">
                <button class="home-btn" onclick="goHome()">Inicio</button>
                <button class="play-again-btn" onclick="playAgain()">Jugar de Nuevo</button>
            </div>
        </div>

    </div>

    <script>
        let currentLevel = 'easy';
        let currentQuestion = 0;
        let score = 0;
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let timer = null;
        let timeLeft = 30;

        const questions = {
            easy: [
                { category: "Biología", question: "¿Cuál es el órgano más grande del cuerpo humano?", options: ["Hígado", "Cerebro", "Piel", "Pulmón"], answer: 2 },
                { category: "Zoología", question: "¿Cuántos corazones tiene un pulpo?", options: ["1", "2", "3", "4"], answer: 2 },
                { category: "Botánica", question: "¿Qué parte de la planta absorbe el agua?", options: ["Tallo", "Hoja", "Raíz", "Flor"], answer: 2 },
                { category: "Astronomía", question: "¿Cuál es la estrella más cercana a la Tierra?", options: ["Sirius", "Sol", "Alpha Centauri", "Polaris"], answer: 1 },
                { category: "Ecología", question: "¿Qué gas liberan las plantas durante la fotosíntesis?", options: ["CO2", "Nitrógeno", "Oxígeno", "Hidrógeno"], answer: 2 },
                { category: "Zoología", question: "¿Cuál es el animal terrestre más rápido del mundo?", options: ["León", "Guepardo", "Gacela", "Caballo"], answer: 1 },
                { category: "Biología", question: "¿Cuántos huesos tiene el cuerpo humano adulto?", options: ["186", "206", "226", "256"], answer: 1 },
                { category: "Ecología", question: "¿Qué es un ecosistema?", options: ["Una ciudad", "Un organismo", "Un comunidad de seres vivos y su entorno", "Una máquina"], answer: 2 },
                { category: "Botánica", question: "¿Cuál es la función principal de las hojas?", options: ["Absorber agua", "Realizar fotosíntesis", "Sostener la planta", "Producir semillas"], answer: 1 },
                { category: "Zoología", question: "¿Qué animal es el mamífero más grande del mundo?", options: ["Elefante", "Ballena azul", "Rinoceronte", "Jirafa"], answer: 1 }
            ],
            medium: [
                { category: "Biología", question: "¿Qué orgánulo celular produce energía?", options: ["Núcleo", "Ribosoma", "Mitocondria", "Lisosoma"], answer: 2 },
                { category: "Astronomía", question: "¿Cuántos planetas tiene el sistema solar?", options: ["7", "8", "9", "10"], answer: 1 },
                { category: "Química", question: "¿Cuál es el elemento químico del agua?", options: ["H2O", "CO2", "O2", "NaCl"], answer: 0 },
                { category: "Ecología", question: "¿Qué es la biodiversidad?", options: ["Contaminación", "Variedad de seres vivos", "Un tipo de animal", "Cambio climático"], answer: 1 },
                { category: "Genética", question: "¿Qué molécula contiene la información genética?", options: ["ARN", "ADN", "Proteína", "Lípidos"], answer: 1 },
                { category: "Zoología", question: "¿Qué animal puede regenerar sus extremidades?", options: ["Perro", "Gato", "Estrella de mar", "Pájaro"], answer: 2 },
                { category: "Botánica", question: "¿Cómo se llama el proceso de reproducción de las flores?", options: ["Germinación", "Polinización", "Fotosíntesis", "Fermentación"], answer: 1 },
                { category: "Física", question: "¿Cuál es la unidad de medida de la fuerza?", options: ["Metros", "Kilogramos", "Newtons", "Watts"], answer: 2 },
                { category: "Biología", question: "¿Qué tipo de sangre es el donante universal?", options: ["A+", "B+", "AB+", "O-"], answer: 3 },
                { category: "Astronomía", question: "¿Cuánto tarda la Tierra en girar alrededor del Sol?", options: ["24 horas", "30 días", "365 días", "1000 días"], answer: 2 }
            ],
            hard: [
                { category: "Biología", question: "¿Cuántos cromosomas tiene una célula humana normal?", options: ["23", "44", "46", "48"], answer: 2 },
                { category: "Genética", question: "¿Quién descubrió la estructura del ADN?", options: ["Newton", "Einstein", "Watson y Crick", "Darwin"], answer: 2 },
                { category: "Química", question: "¿Cuál es el pH del agua pura?", options: ["0", "5", "7", "14"], answer: 2 },
                { category: "Ecología", question: "¿Qué es el efecto invernadero?", options: ["Enfriamiento", "Calentamiento de la atmósfera", "Oxidación", "Condensación"], answer: 1 },
                { category: "Física", question: "¿Cuál es la velocidad de la luz en vacío?", options: ["200,000 km/s", "300,000 km/s", "400,000 km/s", "500,000 km/s"], answer: 1 },
                { category: "Astronomía", question: "¿Qué es un agujero negro?", options: ["Un planeta", "Una estrella", "Una región del espacio con gravedad extrema", "Un cometa"], answer: 2 },
                { category: "Biología", question: "¿Qué enzima digiere las proteínas?", options: ["Amilasa", "Lipasa", "Pepsina", "Celulasa"], answer: 2 },
                { category: "Zoología", question: "¿Qué animal tiene el cerebro más grande en proporción a su cuerpo?", options: ["Delfín", "Elefante", "Humano", "Ratón"], answer: 3 },
                { category: "Botánica", question: "¿Qué es la clorofila?", options: ["Una raíz", "Un pigmento verde para fotosíntesis", "Un tipo de flor", "Una semilla"], answer: 1 },
                { category: "Ecología", question: "¿Qué porcentaje de la Tierra está cubierto por agua?", options: ["50%", "60%", "70%", "80%"], answer: 2 }
            ]
        };

        let shuffledQuestions = [];

        function selectLevel(level) {
            currentLevel = level;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector(`.level-btn.${level}`).classList.add('selected');
        }

        function startGame() {
            currentQuestion = 0;
            score = 0;
            correctAnswers = 0;
            incorrectAnswers = 0;
            
            shuffledQuestions = [...questions[currentLevel]].sort(() => Math.random() - 0.5);
            
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            updateTimer();
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestion >= shuffledQuestions.length) {
                showResults();
                return;
            }

            const q = shuffledQuestions[currentQuestion];
            
            document.getElementById('question-number').textContent = `${currentQuestion + 1}/10`;
            document.getElementById('score').textContent = score;
            document.getElementById('category').textContent = q.category;
            document.getElementById('question').textContent = q.question;
            document.getElementById('progress-bar').style.width = `${(currentQuestion / 10) * 100}%`;
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('next-btn').style.display = 'none';

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-letter">${letters[index]}</span><span>${option}</span>`;
                btn.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            timeLeft = currentLevel === 'easy' ? 30 : currentLevel === 'medium' ? 20 : 15;
            document.getElementById('timer').textContent = timeLeft;
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeUp();
                }
            }, 1000);
        }

        function updateTimer() {
            timeLeft = currentLevel === 'easy' ? 30 : currentLevel === 'medium' ? 20 : 15;
            document.getElementById('timer').textContent = timeLeft;
        }

        function timeUp() {
            const options = document.querySelectorAll('.option-btn');
            options.forEach(btn => btn.classList.add('disabled'));
            
            const q = shuffledQuestions[currentQuestion];
            options[q.answer].classList.add('correct');
            
            incorrectAnswers++;
            showFeedback(false, '¡Tiempo agotado!');
            document.getElementById('next-btn').style.display = 'block';
        }

        function selectAnswer(index) {
            clearInterval(timer);
            
            const q = shuffledQuestions[currentQuestion];
            const options = document.querySelectorAll('.option-btn');
            const isCorrect = index === q.answer;

            options.forEach(btn => btn.classList.add('disabled'));
            options[index].classList.add(isCorrect ? 'correct' : 'incorrect');
            
            if (!isCorrect) {
                options[q.answer].classList.add('correct');
                options[index].classList.add('shake');
            } else {
                options[index].classList.add('pulse');
                const points = currentLevel === 'easy' ? 10 : currentLevel === 'medium' ? 20 : 30;
                const bonus = Math.floor(timeLeft * 0.5);
                score += points + bonus;
                correctAnswers++;
            }

            if (!isCorrect) {
                incorrectAnswers++;
            }

            showFeedback(isCorrect);
            document.getElementById('next-btn').style.display = 'block';
        }

        function showFeedback(isCorrect, customMessage = null) {
            const feedback = document.getElementById('feedback');
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            
            if (customMessage) {
                feedback.textContent = customMessage;
            } else if (isCorrect) {
                const messages = ['¡Excelente!', '¡Correcto!', '¡Muy bien!', '¡Genial!'];
                feedback.textContent = messages[Math.floor(Math.random() * messages.length)];
            } else {
                feedback.textContent = '¡Incorrecto! La respuesta correcta estaba resaltada.';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function showResults() {
            clearInterval(timer);
            
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('results-screen').classList.add('active');

            document.getElementById('final-score').textContent = score;
            document.getElementById('correct-count').textContent = correctAnswers;
            document.getElementById('incorrect-count').textContent = incorrectAnswers;

            const levelNames = { easy: 'Fácil', medium: 'Medio', hard: 'Difícil' };
            const levelBadge = document.getElementById('level-badge');
            levelBadge.textContent = `Nivel: ${levelNames[currentLevel]}`;
            levelBadge.className = `level-badge ${currentLevel}`;

            const percentage = (correctAnswers / 10) * 100;
            const resultsIcon = document.getElementById('results-icon');
            const resultsTitle = document.getElementById('results-title');

            if (percentage >= 80) {
                resultsIcon.textContent = '🏆';
                resultsTitle.textContent = '¡Excelente!';
            } else if (percentage >= 60) {
                resultsIcon.textContent = '🎉';
                resultsTitle.textContent = '¡Buen trabajo!';
            } else if (percentage >= 40) {
                resultsIcon.textContent = '💪';
                resultsTitle.textContent = '¡Sigue practicando!';
            } else {
                resultsIcon.textContent = '📚';
                resultsTitle.textContent = '¡No te rindas!';
            }
        }

        function playAgain() {
            document.getElementById('results-screen').classList.remove('active');
            startGame();
        }

        function goHome() {
            document.getElementById('results-screen').classList.remove('active');
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
        }
    </script>

</body>
</html>
