<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Library API Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Game Library</h1>
        <p>Web application consuming the Flask REST API at <code>/api/games</code></p>
    </header>

    <main>
        <section class="panel">
            <h2>Search records</h2>
            <form id="search-form">
                <input type="text" id="search-query" placeholder="Title, genre, platform or developer...">
                <input type="text" id="search-genre" placeholder="Genre (exact)">
                <input type="number" id="search-year" placeholder="Year">
                <button type="submit">Search</button>
                <button type="button" id="load-all">Load all</button>
            </form>
        </section>

        <section class="panel">
            <h2>Add a record</h2>
            <form id="add-form">
                <div class="form-grid">
                    <label>Title * <input type="text" id="add-title" required></label>
                    <label>Genre <input type="text" id="add-genre"></label>
                    <label>Platform <input type="text" id="add-platform"></label>
                    <label>Developer <input type="text" id="add-developer"></label>
                    <label>Year * <input type="number" id="add-year" min="1970" max="2100" required></label>
                    <label>Rating <input type="number" id="add-rating" min="0" max="10" step="0.1"></label>
                    <label>Price <input type="number" id="add-price" min="0" step="0.01"></label>
                </div>
                <button type="submit">Add game</button>
            </form>
            <p id="add-feedback" class="feedback"></p>
        </section>

        <section class="panel">
            <h2>Results <span id="result-count" class="count"></span></h2>
            <p id="status" class="feedback"></p>
            <table id="games-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Genre</th>
                        <th>Platform</th>
                        <th>Year</th>
                        <th>Rating</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="games-body"></tbody>
            </table>
        </section>

        <section class="panel" id="detail-panel" hidden>
            <h2>Record detail</h2>
            <pre id="detail-json"></pre>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
