<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa con Errores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn-green { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-red { background: linear-gradient(135deg, #eb3349, #f45c43); }
        .btn-purple { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-orange { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .btn-dark { background: linear-gradient(135deg, #0c0c0c, #434343); }
        .btn-yellow { background: linear-gradient(135deg, #fa709a, #fee140); }

        .counter-box {
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 15px;
        }

        .counter-number {
            font-size: 48px;
            font-weight: 700;
            color: #667eea;
        }

        .error-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            color: #856404;
            font-size: 13px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .output {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="titulo-principal">Contador y Acciones</h1>
        <p class="subtitle">Este programa tiene errores... ¿puedes encontrarlos?</p>

        <div class="buttons">
            <button class="btn btn-green" onclick="mostrarMensaje()">Mensaje</button>
            <button class="btn btn-red" onclick="incrementar()">Sumar 1</button>
            <button class="btn btn-purple" onclick="reiniciar()">Reiniciar</button>
            <button class="btn btn-orange" onclick="cambiarColor()">Color</button>
            <button class="btn btn-yellow" onclick="nuevaVentana()">Ventana</button>
            <button class="btn btn-dark" onclick="calcular()">Calcular</button>
        </div>

        <div class="counter-box">
            <p>Contador actual:</p>
            <div class="counter-number" id="contador">0</div>
        </div>

        <div class="output" id="salida">
            <p>Presiona los botones para ver qué pasa...</p>
        </div>

        <div class="error-box" id="errores">
            ✅ Todos los errores han sido corregidos
        </div>
    </div>

    <script>
        let contador = 0;

        function mostrarMensaje() {
            alert("Hola desde el programa");
        }

        function incrementar() {
            contador = contador + 1;
            document.getElementById("contador").textContent = contador;
        }

        function reiniciar() {
            contador = 0;
            document.getElementById("contador").textContent = contador;
        }

        function cambiarColor() {
            document.body.style.backgroundColor = "#ffcccc";
        }

        function nuevaVentana() {
            window.open("https://www.google.com", "_blank", "width=500,height=400");
        }

        function calcular() {
            let resultado = 10 * 5;
            document.getElementById("salida").innerHTML = "<p>El resultado es: " + resultado + "</p>";
        }

        function extra() {
            const numero = 10;
            if (numero == 10) {
                console.log("Son iguales");
            }
        }
    </script>

</body>
</html>
